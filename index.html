<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        /* ============================= */
        /* CSS STYLING (UPDATED) */
        /* ============================= */

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
        }

        .clock {
            width: 350px;
            height: 350px;
            border: 10px solid #333;
            border-radius: 50%;
            position: relative; /* Crucial for positioning the hands */
            background: #fff;
        }

        .hand {
            /* CRITICAL FIXES START HERE */
            position: absolute;
            /* Setting top/left to 50% and transforming back by half its own size centers it perfectly. */
            top: 50%;
            left: 50%;
            transform-origin: center center; /* Set rotation origin to the element's defined center */
            margin-top: -1px; /* Adjust for border effects */

            /* This combination ensures the rotational point is exactly in the middle of .clock */
        }


        /* The Hour Hand (Short and thick) */
        #hour-hand {
            width: 8%; /* Slightly wider to look balanced */
            height: 70px; /* Length - shortened slightly for visual balance */
            background-color: #333;
            transform: translate(-50%, 0); /* Adjusting offset after positioning logic is complex, simple translation of origin helps */
            /* We rely on the general hand styling + absolute positioning to handle centering. */
        }

        /* The Minute Hand (Medium length) */
        #minute-hand {
            width: 4%;
            height: 130px; /* Length */
            background-color: #333;
             transform: translate(-50%, 0);
        }

        /* The Second Hand (Thin and distinct) */
        #second-hand {
            width: 2px;
            height: 160px; /* Length */
            background-color: red;
            transform: translate(-50%, 0);
        }


        /* Center Pivot remains the same - it's correct for a visual overlay */
        .clock::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background-color: #333;
            border-radius: 50%;
            z-index: 40;
        }

    </style>
</head>
<body >

    <div class="clock">
        <!-- Note on the Hand Styling Trick: -->
        <!-- Because we are using `position: absolute` and want rotation to happen at 50%,
             we define the hand's dimensions (height/width) and then use 'translate(-50%, 0)'
             in CSS for a visual offset, but JS must still rotate relative to the central pivot. -->
        <div id="hour-hand" class="hand"></div>
        <div id="minute-hand" class="hand"></div>
        <div id="second-hand" class="hand"></div>
    </div >

    <script>
        /* ============================= */
        /* JAVASCRIPT LOGIC (NO CHANGES NEEDED) */
        /* ============================= */

        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const secondHand = document.getElementById('second-hand');

        function updateClock() {
            // Get the current local time
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            // Normalize to 12-hour format
            hours %= 12;
            minutes %= 60;
            seconds %= 60;

            /* Calculate Degrees */

            // Second Hand: 360 degrees in 60 seconds (6 deg/sec)
            let secondDegrees = (seconds * 6);

            // Minute Hand: 360 degrees in 60 minutes. Added bonus from seconds.
            let minuteDegrees = ((minutes * 6) + (seconds * 0.1));

            // Hour Hand: 360 degrees in 12 hours. Bonus from minutes and seconds.
            let hourDegrees = ((hours * 30) + (minutes * 0.5) + (seconds * 0.0083));


            /* Apply Rotation */

            secondHand.style.transform = `rotate(${Math.round(secondDegrees)}deg)`;
            minuteHand.style.transform = `rotate(${Math.round(minuteDegrees)}deg)`;
            hourHand.style.transform = `rotate(${Math.round(hourDegrees)}deg)`;
        }

        // Initial call and continuous update (50ms for smoothness)
        updateClock();
        setInterval(updateClock, 50);
    </script>
</body>
</html>
