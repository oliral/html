<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analoge klok</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#f6f6f6;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .clock-wrap{
      width: min(420px, 80vw);
      aspect-ratio: 1 / 1;
      display:grid;
      place-items:center;
    }

    .clock{
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      border: 10px solid #222;
      overflow: hidden;
    }

    /* optionele wijzerplaat */
    .ticks{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        radial-gradient(circle at center, transparent 58%, rgba(0,0,0,.06) 59%, transparent 60%),
        conic-gradient(from -90deg,
          rgba(0,0,0,.22) 0deg 1deg,
          transparent 1deg 6deg,
          rgba(0,0,0,.22) 6deg 7deg,
          transparent 7deg 30deg
        );
      mask: radial-gradient(circle at center, transparent 0 55%, #000 56% 100%);
      pointer-events:none;
    }

    /* wijzers (belangrijk: draaipunt exact op midden) */
    .hand{
      position:absolute;
      left:50%;
      top:50%;
      transform-origin: 50% 100%; /* onderkant = draaipunt */
      z-index: 2;
    }

    /* basis plaatsen met translate(-50%, -100%) */
    #hour-hand{
      width: 8%;
      height: 70px;
      background: #333;
      border-radius: 6px;
      transform: translate(-50%, -100%) rotate(0deg);
    }

    #minute-hand{
      width: 4%;
      height: 130px;
      background: #333;
      border-radius: 6px;
      transform: translate(-50%, -100%) rotate(0deg);
    }

    #second-hand{
      width: 2px;
      height: 160px;
      background: #e60000;
      border-radius: 2px;
      transform: translate(-50%, -100%) rotate(0deg);
      z-index: 3;
    }

    /* middelpunt */
    .hub{
      position:absolute;
      left:50%;
      top:50%;
      width: 18px;
      height: 18px;
      background:#111;
      border-radius:50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      box-shadow: inset 0 0 0 3px #fff;
    }

    /* optioneel: subtiele gradenverdeling / look */
    .center-glow{
      position:absolute;
      left:50%;
      top:50%;
      width: 140px;
      height: 140px;
      transform: translate(-50%, -50%);
      border-radius:50%;
      background: radial-gradient(circle, rgba(0,0,0,.06), transparent 60%);
      pointer-events:none;
    }
  </style>
</head>
<body>
  <div class="clock-wrap">
    <div class="clock" aria-label="Analoge klok">
      <div class="ticks"></div>
      <div class="center-glow"></div>

      <!-- wijzers -->
      <div id="hour-hand" class="hand"></div>
      <div id="minute-hand" class="hand"></div>
      <div id="second-hand" class="hand"></div>

      <div class="hub"></div>
    </div>
  </div>

  <script>
    const hourHand = document.getElementById('hour-hand');
    const minuteHand = document.getElementById('minute-hand');
    const secondHand = document.getElementById('second-hand');

    function updateClock(){
      const now = new Date();

      const seconds = now.getSeconds() + now.getMilliseconds() / 1000;
      const minutes = now.getMinutes() + seconds / 60;
      const hours = (now.getHours() % 12) + minutes / 60;

      const secondDegrees = (seconds / 60) * 360;
      const minuteDegrees = (minutes / 60) * 360;
      const hourDegrees = (hours / 12) * 360;

      // translate(-50%, -100%) zorgt dat de basis exact op het midden ligt.
      secondHand.style.transform  = `translate(-50%, -100%) rotate(${secondDegrees}deg)`;
      minuteHand.style.transform  = `translate(-50%, -100%) rotate(${minuteDegrees}deg)`;
      hourHand.style.transform    = `translate(-50%, -100%) rotate(${hourDegrees}deg)`;
    }

    updateClock();
    setInterval(updateClock, 16); // ~60fps
  </script>
</body>
</html>
